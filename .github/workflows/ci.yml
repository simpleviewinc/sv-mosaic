name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - qa
      - staging
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Workspace Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build workspace image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: mosaic-workspace:local
          load: true
          cache-from: type=gha,scope=mosaic-workspace
          cache-to: type=gha,mode=max,scope=mosaic-workspace

      - name: Save workspace image
        run: docker save mosaic-workspace:local -o workspace-image.tar

      - name: Upload workspace image
        uses: actions/upload-artifact@v4
        with:
          name: workspace-image
          path: workspace-image.tar
          retention-days: 1

  unit:
    name: Unit Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-workspace-image
      - name: Run unit tests
        run: docker compose up --exit-code-from mosaic-units mosaic-units

  consumer:
    name: Consumer Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-workspace-image
      - name: Run consumer tests
        run: docker compose up --exit-code-from consumer-tests consumer-tests

  storybook-typecheck:
    name: Storybook Typecheck
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-workspace-image
      - name: Typecheck Storybook
        run: docker compose up --exit-code-from storybook-typecheck storybook-typecheck

  e2e:
    name: E2E Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-workspace-image

      - name: Start Storybook static server
        run: docker compose up -d storybook-serve

      - name: Wait for Storybook
        run: |
          for i in $(seq 1 60); do
            if curl --head --silent --fail http://localhost:10001/ >/dev/null; then
              echo "Storybook is ready"
              exit 0
            fi
            echo "Waiting for Storybook... ($i)"
            sleep 5
          done
          echo "Storybook did not become ready in time"
          docker compose logs storybook-serve
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          VERSION=$(pnpm --filter @simpleview/sv-mosaic-e2e exec node -e "console.log(require('@playwright/test/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Copy mosaic dist from workspace image
        run: |
          cid=$(docker create mosaic-workspace:local)
          docker cp "$cid:/app/packages/mosaic/dist" ./packages/mosaic/dist
          docker rm "$cid"

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @simpleview/sv-mosaic-e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @simpleview/sv-mosaic-e2e exec playwright install-deps chromium

      - name: Run Playwright tests
        working-directory: packages/e2e
        env:
          CI: true
          ENV: local
        run: pnpm test:chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7

      - name: Stop Storybook
        if: always()
        run: docker compose down --remove-orphans

  publish-npm:
    name: Publish to NPM
    needs:
      - build
      - unit
      - consumer
      - storybook-typecheck
      - e2e
    # TEMPORARY: also publish from PR #986 so we can validate NPM without merging to staging.
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'pull_request' && github.event.pull_request.number == 986)
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-workspace-image

      - name: Extract mosaic package from workspace image
        run: |
          cid=$(docker create mosaic-workspace:local)
          docker cp "$cid:/app/packages/mosaic/dist" ./packages/mosaic/dist
          docker cp "$cid:/app/packages/mosaic/package.json" ./packages/mosaic/package.json
          docker cp "$cid:/app/packages/mosaic/package.types.json" ./packages/mosaic/package.types.json
          docker rm "$cid"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        working-directory: packages/mosaic
        env:
          # PR refs look like "986/merge" (invalid for npm); use pr986 for the temporary PR path.
          PUBLISH_REF_NAME: ${{ github.event.pull_request.number == 986 && 'pr986' || github.ref_name }}
          PUBLISH_SHA: ${{ github.sha }}
        run: pnpm publish:npm

  publish-storybook:
    name: Publish Storybook
    needs:
      - build
      - unit
      - consumer
      - storybook-typecheck
      - e2e
    # TEMPORARY: also publish from PR #986 so we can validate GitHub Pages without merging to staging.
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'pull_request' && github.event.pull_request.number == 986)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-workspace-image

      - name: Export Storybook static files
        run: |
          cid=$(docker create mosaic-workspace:local)
          docker cp "$cid:/app/packages/storybook/storybook-static" ./storybook-static
          docker rm "$cid"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          destination_dir: sb8/${{ github.event.pull_request.number == 986 && 'pr986' || github.ref_name }}
          keep_files: true
