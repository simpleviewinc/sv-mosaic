services:
  workspace:
    image: mosaic-workspace:local
    build: .
    working_dir: /app

  mosaic-units:
    container_name: mosaic-units
    extends: workspace
    environment:
      - CI=true
    command: ["pnpm", "--filter", "@simpleview/sv-mosaic", "test", "--", "--run"]

  mosaic-publish:
    container_name: mosaic-publish
    extends: workspace
    environment:
      - GITHUB_REF_NAME=${GITHUB_REF_NAME}
      - GITHUB_SHA=${GITHUB_SHA}
      - NPM_TOKEN=${NPM_TOKEN}
    command: ["pnpm", "--filter", "@simpleview/sv-mosaic", "publish:npm"]

  storybook-typecheck:
    container_name: storybook-typecheck
    extends: workspace
    command: ["pnpm", "--filter", "@simpleview/sv-mosaic-storybook", "types"]

  storybook-dev:
    container_name: storybook-dev
    extends: workspace
    volumes:
      - ./packages/mosaic/src:/app/packages/mosaic/src
      - ./packages/storybook/stories:/app/packages/storybook/stories
    ports:
      - 10001:10001
    command: ["pnpm", "dev"]

  storybook-serve:
    container_name: storybook-serve
    extends: workspace
    ports:
      - 10001:10001
    command: ["bash", "-c", "npx --yes http-server ./packages/storybook/storybook-static -p 10001 --silent"]

  consumer-tests:
    container_name: consumer-tests
    extends: workspace
    command: ["pnpm", "--filter", "@simpleview/sv-mosaic-consumer-tests", "types"]

  e2e-tests:
    container_name: e2e-tests
    image: mosaic-e2e:local
    build:
      context: .
      dockerfile: packages/e2e/Dockerfile
    environment:
      - CI=true
    depends_on:
      - storybook-serve
    command: ["./scripts/start"]
